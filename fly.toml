app = "day-planner-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PLANNER_DB = "/data/planner.sqlite3"
  PORT = "8080"

[mounts]
  source = "planner_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
